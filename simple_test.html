<!DOCTYPE html>
<html>
<head>
    <title>Test get_total API</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>Test get_total API</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('https://qcec-qatar.com/app2026/sql.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'get_total',
                        uid: '1',
                        x: '0'
                    })
                });
                
                const text = await response.text();
                console.log('Raw response:', text);
                
                try {
                    const data = JSON.parse(text);
                    resultDiv.innerHTML = `
                        <h3>Success!</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } catch (e) {
                    resultDiv.innerHTML = `
                        <h3>JSON Parse Error</h3>
                        <p>Error: ${e.message}</p>
                        <h4>Raw Response:</h4>
                        <pre>${text}</pre>
                    `;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>Network Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
